# Même origine pour le SPA et l'API : le cookie de rafraîchissement peut rester en SameSite=Strict, sans CORS.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;


  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 70s;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.conf; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; include /etc/nginx/security-headers.conf; try_files $uri /index.html; }
}
